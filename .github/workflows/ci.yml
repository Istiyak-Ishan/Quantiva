# .github/workflows/ci.yml
# Continuous Integration pipeline for Quantiva Desktop Application
#
# Validates:
# - Backend: ruff linting, mypy type-checking, pytest unit/e2e/eval suites
# - Frontend: eslint linting, Next.js static export build (Tauri webview dist)
# - Tauri Shell: Rust desktop shell compilation check on Windows
# - Security: Secret scanning with Gitleaks, dependency vulnerability auditing

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Quality Gate ──────────────────────────────────────────────────
  backend:
    name: Backend · Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-test.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ --select F,E9

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --explicit-package-bases --ignore-missing-imports --no-strict-optional

      - name: Run pytest (Desktop SQLite / Local Vector)
        working-directory: backend
        env:
          QUANTIVA_DATA_DIR: /tmp/quantiva_ci_data
          SECRET_KEY: test-only-secret-not-for-production-123456789
          GOOGLE_API_KEY: mock-key-for-tests
          HF_HUB_OFFLINE: "1"
        run: pytest tests/ -v --tb=short

  # ── Frontend Quality Gate ─────────────────────────────────────────────────
  frontend:
    name: Frontend · Lint · Static Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js static export (for Tauri)
        working-directory: frontend
        run: npm run build

  # ── Tauri 2 Desktop Shell ─────────────────────────────────────────────────
  tauri-shell:
    name: Tauri 2 · Rust Desktop Shell Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust Tauri shell
        working-directory: src-tauri
        run: cargo check

  # ── Security & Secret Scanning ────────────────────────────────────────────
  security:
    name: Security · Secret Scanning · Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
