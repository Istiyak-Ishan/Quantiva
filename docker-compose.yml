# Local stack. Existing named volumes are preserved; never use `down -v` to repair.
# Langfuse is optional/external, not an incomplete service that breaks startup.
x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://quantiva_user:quantiva_password@postgres:5432/quantiva_db
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  S3_ENDPOINT_URL: http://s3:9090
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9090}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in the root .env or shell}
  SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY in the root .env or shell}
  METRICS_TOKEN: ${METRICS_TOKEN:?Set a random METRICS_TOKEN in the root .env or shell}
  GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-quantiva_v2}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  PII_ENGINE: ${PII_ENGINE:-patterns}
  SPACY_MODEL: ${SPACY_MODEL:-en_core_web_sm}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
  LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  APP_ENV: development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantiva_user
      POSTGRES_PASSWORD: quantiva_password
      POSTGRES_DB: quantiva_db
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantiva_user -d quantiva_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    restart: unless-stopped

  s3:
    image: adobe/s3mock:5.2.3
    environment:
      initialBuckets: quantiva-documents
      root: /s3mockroot
      retainFilesOnExit: "true"
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["s3_data:/s3mockroot"]
    restart: unless-stopped

  migrate:
    build: ./backend
    environment: *app-environment
    command: alembic upgrade head
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    build: ./backend
    environment: *app-environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      s3: {condition: service_started}
    restart: unless-stopped

  celery_worker:
    build: ./backend
    environment: *app-environment
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck: {disable: true}
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args: {BACKEND_URL: "http://backend:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:9091:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets: [metrics_token]
    depends_on: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3002:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env or shell}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

secrets:
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  s3_data:
  # Retained for compatibility; removing a service must not imply deleting data.
  langfuse_db_data:
  prometheus_data:
  grafana_data:
