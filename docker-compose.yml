# docker-compose.yml — Quantiva full stack
# Starts: Postgres, Redis, Qdrant, S3Mock, FastAPI, Celery,
#          Langfuse (LLM observability), Prometheus, Grafana, Next.js frontend

services:
  # ── Data stores ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantiva_user
      POSTGRES_PASSWORD: quantiva_password
      POSTGRES_DB: quantiva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantiva_user -d quantiva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: adobe/s3mock:latest
    environment:
      - initialBuckets=quantiva-documents
    ports:
      - "9090:9090"
      - "9191:9191"
    volumes:
      - s3_data:/s3mockroot

  # ── Langfuse — LLM observability ─────────────────────────────────────────────
  # Web UI at http://localhost:3001
  # Default creds: admin@quantiva.ai / changeme

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse_user
      POSTGRES_PASSWORD: langfuse_password
      POSTGRES_DB: langfuse_db
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse_user -d langfuse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse_user:langfuse_password@langfuse-db:5432/langfuse_db
      NEXTAUTH_SECRET: langfuse-nextauth-secret-change-in-prod
      NEXTAUTH_URL: http://localhost:3001
      SALT: langfuse-salt-change-in-prod
      LANGFUSE_INIT_ORG_ID: quantiva-org
      LANGFUSE_INIT_ORG_NAME: Quantiva
      LANGFUSE_INIT_PROJECT_ID: quantiva-project
      LANGFUSE_INIT_PROJECT_NAME: "Quantiva AI"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-quantiva-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-quantiva-dev
      LANGFUSE_INIT_USER_EMAIL: admin@quantiva.ai
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: changeme
    depends_on:
      langfuse-db:
        condition: service_healthy

  # ── Monitoring ────────────────────────────────────────────────────────────────
  # Prometheus at http://localhost:9090
  # Grafana at http://localhost:3002  (admin / admin)

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ── Application services ──────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://quantiva_user:quantiva_password@postgres:5432/quantiva_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://s3:9090
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-your-dev-google-api-key}
      - SECRET_KEY=${SECRET_KEY:-your-dev-secret-key-change-in-prod}
      - LANGFUSE_SECRET_KEY=sk-lf-quantiva-dev
      - LANGFUSE_PUBLIC_KEY=pk-lf-quantiva-dev
      - LANGFUSE_HOST=http://langfuse:3000
      - APP_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      s3:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://quantiva_user:quantiva_password@postgres:5432/quantiva_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://s3:9090
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-your-dev-google-api-key}
      - SECRET_KEY=${SECRET_KEY:-your-dev-secret-key-change-in-prod}
      - LANGFUSE_SECRET_KEY=sk-lf-quantiva-dev
      - LANGFUSE_PUBLIC_KEY=pk-lf-quantiva-dev
      - LANGFUSE_HOST=http://langfuse:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  s3_data:
  langfuse_db_data:
  prometheus_data:
  grafana_data:
